apply plugin: 'com.android.application'

// İkinci uygulama (yan yana kurulum): aynı kaynaktan, farklı paket adı ve
// görünen adla ikinci bir APK üretir:
//   gradlew assembleRelease -Puygulama=ikiz
// Birincil uygulama (Play) bu bayrak verilmeden derlenir ve eskisi gibi
// com.notbahcesi.app olarak kalır.
def ikizUygulama = ['ikiz', 'ikinci', '2'].contains((project.findProperty('uygulama') ?: '').toString().trim().toLowerCase())

// Play Store release imzası: android/keystore.properties (repoya girmez)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// İmzasız yayın paketi Play'e yüklenemez; keystore yoksa sessizce üretmek yerine dur.
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseSigning && graph.allTasks.any { it.name ==~ /(assemble|bundle)Release/ }) {
        throw new GradleException("android/keystore.properties bulunamadı: yayın paketi imzalanamaz.")
    }
}

android {
    namespace "com.notbahcesi.app"
    compileSdk rootProject.ext.compileSdkVersion
    // Cihaz testleri yüklü release uygulamasıyla aynı imzayla koşsun:
    // gradlew assembleReleaseAndroidTest -PtestBuildType=release
    testBuildType project.findProperty('testBuildType') ?: 'debug'
    defaultConfig {
        applicationId ikizUygulama ? "com.notbahcesi.app2" : "com.notbahcesi.app"
        // Görünen ad manifest'ten gelir; iki uygulama aynı anda kurulabilsin diye
        // ikinci kopya farklı adla kurulur.
        manifestPlaceholders = [uygulamaAdi: ikizUygulama ? "Not Bahçesi 2" : "Not Bahçesi"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 69
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // R8: sınıf adlarını gizler, kullanılmayan kodu atar. Capacitor ve
            // Play Services kendi kurallarını getirir; ek kurallar
            // proguard-rules.pro içinde.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Yerel (.so) kütüphanelerin sembol tablosu AAB'ye eklenir: Play'in
            // "hata ayıklama sembolleri yüklemediniz" uyarısı kalkar, çökme
            // raporları okunur olur. Uygulamanın boyutunu değiştirmez.
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.mediapipe:tasks-genai:0.10.35'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'
    // MediaPipe seçenek sınıflarının annotation referansları R8 tarafından okunur.
    implementation 'com.google.auto.value:auto-value-annotations:1.11.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    // Google Hizmetleri eklentisi paket adına göre istemci arar; ikinci uygulamanın
    // paketi google-services.json içinde yok, bu yüzden yalnız birincil uygulamada
    // uygulanır. (Google ile giriş/Drive yedeği ikinci kopyada kullanılmaz.)
    if (servicesJSON.text && !ikizUygulama) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
