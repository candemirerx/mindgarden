// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // compileSdk 36 için AGP 8.9.1+ gerekir; Android Studio Narwhal ile
        // gelen 8.11.1 sürümü kullanılıyor.
        classpath 'com.android.tools.build:gradle:8.11.1'
        // LiteRT-LM uses Kotlin 2.4 metadata; keep the shrinker compatible.
        classpath 'com.android.tools:r8:9.4.28'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// 👇 SİHİRLİ DOKUNUŞ BURADA 👇
// Bu kod, projedeki tüm modülleri (Capacitor dahil) Java 17 kullanmaya zorlar.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
